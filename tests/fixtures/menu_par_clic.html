<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Portail à menu ouvert au clic</title>
<style>
  #menuPrincipal, #menuPrincipal ul { list-style: none; margin: 0; padding: 0; }
  #menuPrincipal > li { display: inline-block; position: relative; padding: 8px 14px; }
  #menuPrincipal > li > ul { display: none; position: absolute; left: 0; top: 100%;
                             background: #fff; border: 1px solid #ccc; min-width: 200px; }
  #menuPrincipal > li.ouvert > ul { display: block; }
</style></head>
<body>
<!-- Ici le sous-menu ne s'ouvre qu'au clic sur l'entrée parente : ni la
     pseudo-classe :hover ni les événements de survol n'y changent rien. -->
<ul id="menuPrincipal">
  <li><a href="#">Accueil</a></li>
  <li id="parent">Mes comptes
    <ul>
      <li><a href="#">Situation</a></li>
      <li><a href="#">Soldes</a></li>
      <li><a href="#" id="cible">Relevés d'opérations</a></li>
    </ul>
  </li>
</ul>
<p id="resultat">rien</p>
<script>
  document.getElementById('parent').addEventListener('click', function (evenement) {
    if (evenement.target === this) this.classList.toggle('ouvert');
  });
  document.getElementById('cible').onclick = function () {
    document.getElementById('resultat').textContent = 'releve ouvert';
  };
</script>
</body></html>
