[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bankextract"
version = "0.1.0"
description = "Extraction automatisée des relevés de comptes depuis les portails e-banking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "playwright>=1.44",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=24.0",
    "python-dotenv>=1.0",
    "pyotp>=2.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # Serveur SMTP local : les tests d'envoi ne sortent jamais sur Internet.
    "aiosmtpd>=1.4",
    # Fabrication des relevés PDF servant à tester leur analyse.
    "reportlab>=4.0",
]

[project.scripts]
bankextract = "bankextract.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["e2e: parcours complet nécessitant un navigateur"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "UP"]
ignore = [
    # typer impose l'appel de fonction en valeur par défaut (typer.Option(...)).
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Les tests instancient volontairement des attributs de classe mutables.
"tests/*" = ["B011"]
# Les jeux de données du faux portail sont alignés en colonnes : plus lisibles longs.
"tests/fixtures/fake_bank/server.py" = ["E501"]
